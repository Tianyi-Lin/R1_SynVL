[project]
name = "r1-syntheticvl-cads"
version = "0.1.0"
description = "CADS data synthesis for R1-SyntheticVL"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "datasets>=4.0,<6",
    "google-genai>=1.0,<3",
    "openai>=1.0,<3",
    "Pillow>=10.0,<13",
    "PyYAML>=6.0,<7",
]

[tool.uv]
package = false
cache-dir = ".cache/uv"
